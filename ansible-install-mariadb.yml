---
- name: Install MariaDB on Ubuntu 20.04 (OCI)
  hosts: all
  become: yes
  gather_facts: false

  vars:
    mariadb_root_password: "root"
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
    - name: Ensure Python and Ansible dependencies are installed
      raw: |
        apt-get update &&
        apt-get install -y python3 python3-apt python3-debian python3-pymysql
      changed_when: false

  tasks:
    - name: Add MariaDB official repository
      ansible.builtin.deb822_repository:
        name: mariadb
        types:
          - deb
        uris:
          - https://mirror.rackspace.com/mariadb/repo/11.6/ubuntu
        suites:
          - focal
        components:
          - main
        architectures:
          - amd64
        signed_by: https://mariadb.org/mariadb_release_signing_key.asc
        state: present

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install MariaDB server and client
      ansible.builtin.apt:
        name:
          - mariadb-server
          - mariadb-client
        state: present

    - name: Start and enable MariaDB service
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: yes

    - name: Set MariaDB root password
      ansible.mysql.mysql_user:
        name: root
        host: localhost
        password: "{{ mariadb_root_password }}"
        check_implicit_admin: yes
        login_unix_socket: /run/mysqld/mysqld.sock
        state: present
      no_log: true

    - name: Create root credentials configuration
      ansible.builtin.copy:
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: '0600'
        content: |
          [client]
          user=root
          password={{ mariadb_root_password }}
      no_log: true

    - name: Remove anonymous users
      ansible.mysql.mysql_user:
        name: ''
        host_all: yes
        state: absent

    - name: Disallow root login remotely
      ansible.mysql.mysql_user:
        name: root
        host: "%"
        state: absent

    - name: Remove test database
      ansible.mysql.mysql_db:
        name: test
        state: absent
