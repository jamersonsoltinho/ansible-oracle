---
- name: Install MariaDB on Ubuntu 20.04 (OCI)
  hosts: all
  become: yes
  gather_facts: false

  vars:
    mariadb_root_password: "root"
    mariadb_repository: "https://mirror.rackspace.com/mariadb/repo/11.6/ubuntu"
    mariadb_gpg_key: "https://mariadb.org/mariadb_release_signing_key.asc"

  tasks:
    - name: Install required packages
      ansible.builtin.raw: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          ca-certificates curl gnupg
      changed_when: false

    - name: Configure MariaDB repository and GPG key
      ansible.builtin.raw: |
        set -e

        KEY_FILE=/usr/share/keyrings/mariadb-archive-keyring.gpg
        REPO_FILE=/etc/apt/sources.list.d/mariadb.list

        curl -fsSL "{{ mariadb_gpg_key }}" | \
          gpg --dearmor --yes -o "$KEY_FILE"

        echo "deb [arch=amd64 signed-by=$KEY_FILE] {{ mariadb_repository }} focal main" \
          > "$REPO_FILE"

        apt-get update
      register: repository_result
      changed_when: true

    - name: Install MariaDB server and client
      ansible.builtin.raw: |
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          mariadb-server mariadb-client

    - name: Start and enable MariaDB service
      ansible.builtin.raw: |
        systemctl enable mariadb
        systemctl start mariadb
        systemctl is-active mariadb

    - name: Set MariaDB root password
      ansible.builtin.raw: |
        set -e

        if mariadb -uroot -e "SELECT 1" >/dev/null 2>&1; then
          mariadb -uroot -e \
            "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mariadb_root_password }}';"
        elif mariadb -uroot -p'{{ mariadb_root_password }}' \
          -e "SELECT 1" >/dev/null 2>&1; then
          echo "Root password already configured"
        else
          echo "Unable to authenticate as MariaDB root" >&2
          exit 1
        fi
      no_log: true

    - name: Remove anonymous users
      ansible.builtin.raw: |
        mariadb -uroot -p'{{ mariadb_root_password }}' -e "
          DELETE FROM mysql.global_priv
          WHERE User = '';
          FLUSH PRIVILEGES;
        "
      no_log: true

    - name: Disallow root login remotely
      ansible.builtin.raw: |
        mariadb -uroot -p'{{ mariadb_root_password }}' -e "
          DELETE FROM mysql.global_priv
          WHERE User = 'root'
          AND Host NOT IN ('localhost', '127.0.0.1', '::1');
          FLUSH PRIVILEGES;
        "
      no_log: true

    - name: Remove test database
      ansible.builtin.raw: |
        mariadb -uroot -p'{{ mariadb_root_password }}' -e "
          DROP DATABASE IF EXISTS test;
        "
      no_log: true
